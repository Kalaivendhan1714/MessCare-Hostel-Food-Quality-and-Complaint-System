{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>MessCare - Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        :root {
            --mc-green: #1b7a4c;
            --mc-green-dark: #145c39;
            --mc-green-light: #e8f7ee;
        }

        * {
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f7f5;
        }

        .register-box {
            max-width: 650px;
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            width: 64px;
            height: 64px;
            background: var(--mc-green-light);
            color: var(--mc-green);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: auto;
        }

        .register-title {
            color: #111827;
            font-weight: 700;
        }

        .register-subtitle {
            color: #6b7280;
            font-size: 14px;
        }

        .form-label {
            color: #374151;
            font-size: 14px;
        }

        .form-control {
            border: 1px solid #dcdfe6;
            border-radius: 9px;
            padding: 11px 13px;
        }

        .form-control:focus {
            border-color: var(--mc-green);
            box-shadow: 0 0 0 3px rgba(27, 122, 76, 0.12);
        }

        .register-btn {
            background: var(--mc-green);
            border: none;
            color: white;
            border-radius: 9px;
            padding: 11px;
            font-weight: 600;
        }

        .register-btn:hover {
            background: var(--mc-green-dark);
            color: white;
        }

        .login-link {
            color: var(--mc-green);
        }

        .login-link:hover {
            color: var(--mc-green-dark);
        }

    </style>
</head>

<body>

<div class="container py-5">

    <div class="card register-box mx-auto">

        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">

                <div class="logo">🍽️</div>

                <h2 class="register-title mt-3 mb-1">Create Account</h2>

                <p class="register-subtitle mb-0">
                    Register for MessCare
                </p>

            </div>

            <form method="POST">

                {% csrf_token %}

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">
                            Name
                        </label>

                        <input type="text"
                               name="name"
                               class="form-control"
                               placeholder="Enter your name"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">
                            Email
                        </label>

                        <input type="email"
                               name="email"
                               class="form-control"
                               placeholder="Enter your email"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">
                            Phone Number
                        </label>

                        <input type="text"
                               name="phone_no"
                               class="form-control"
                               placeholder="Enter phone number"
                               maxlength="10"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">
                            Hostel Name
                        </label>

                        <input type="text"
                               name="hostel_name"
                               class="form-control"
                               placeholder="Enter hostel name"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">
                            Branch Name
                        </label>

                        <input type="text"
                               name="branch_name"
                               class="form-control"
                               placeholder="Enter branch name"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">
                            Room Number
                        </label>

                        <input type="text"
                               name="room_no"
                               class="form-control"
                               placeholder="Enter room number"
                               required>
                    </div>

                    <div class="col-12 mb-4">
                        <label class="form-label fw-semibold">
                            Password
                        </label>

                        <input type="password"
                               name="password"
                               class="form-control"
                               placeholder="Create password"
                               required>
                    </div>

                </div>

                <button type="submit"
                        class="btn register-btn w-100">
                    Create Account
                </button>

            </form>

            <div class="text-center mt-4">

                <span class="text-muted">
                    Already have an account?
                </span>

                <a href="{% url 'login' %}"
                   class="text-decoration-none fw-semibold login-link">
                    Login
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
