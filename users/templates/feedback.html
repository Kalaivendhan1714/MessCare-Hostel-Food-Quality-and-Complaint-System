{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>MessCare - Feedback</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{% static 'users/style.css' %}">

    <style>

        :root {
            --mc-green: #1b7a4c;
            --mc-green-dark: #145c39;
            --mc-green-light: #e8f7ee;
        }

        * {
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #f4f7f5;
        }

        .messcare-navbar {
            background: linear-gradient(90deg, var(--mc-green) 0%, var(--mc-green-dark) 100%);
        }

        .form-card {
            border: none;
            border-radius: 18px;
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.06);
        }

        .form-icon {
            width: 62px;
            height: 62px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--mc-green-light);
            border-radius: 16px;
            font-size: 30px;
        }

        h2.fw-bold {
            color: #111827;
        }

        .form-label {
            color: #374151;
            font-size: 14px;
        }

        .form-control,
        .form-select {
            border: 1px solid #dcdfe6;
            border-radius: 9px;
            padding: 11px 13px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--mc-green);
            box-shadow: 0 0 0 3px rgba(27, 122, 76, 0.12);
        }

        .btn-mc-primary {
            background: var(--mc-green);
            border: none;
            color: white;
            border-radius: 9px;
            padding: 11px;
            font-weight: 600;
        }

        .btn-mc-primary:hover {
            background: var(--mc-green-dark);
            color: white;
        }

        .back-link {
            color: var(--mc-green);
            font-weight: 600;
        }

        .back-link:hover {
            color: var(--mc-green-dark);
        }
        
        .back-bar {
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
    padding: 10px 20px;
}

.btn-back-link {
    color: var(--mc-green);
    font-weight: 600;
    font-size: 14px;
    text-decoration: none;
}

.btn-back-link:hover {
    color: var(--mc-green-dark);
}

    </style>
</head>

<body>

<nav class="navbar navbar-dark messcare-navbar px-3">

    <a href="{% url 'studentpage' user.id %}"
       class="navbar-brand fw-bold">
        🍽️ MessCare
    </a>

    <a href="{% url 'logout' %}"
       class="btn btn-outline-light btn-sm">
        Logout
    </a>

</nav>
<!-- BACK BAR (right below navbar) -->

<div class="back-bar">
    <div class="container-fluid text-end">
        <a href="{% url 'studentpage' user.id %}" class="btn-back-link">
            ← Back to Dashboard
        </a>
    </div>
</div>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7 col-lg-6">

            <div class="card form-card">

                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">

                        <div class="form-icon">
                            ⭐
                        </div>

                        <h2 class="fw-bold mt-3">
                            Give Feedback
                        </h2>

                        <p class="text-muted">
                            Tell us about your mess food experience
                        </p>

                    </div>

{% if messages %}
    {% for message in messages %}

        <div class="alert alert-success alert-dismissible fade show"
             role="alert">

            ✅ {{ message }}

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
            </button>

        </div>

    {% endfor %}
{% endif %}

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Your Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   value="{{ user.name }}"
                                   readonly>

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Rating
                            </label>

                            <select name="rating"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Select your rating
                                </option>

                                <option value="5">
                                    ⭐⭐⭐⭐⭐ Excellent
                                </option>

                                <option value="4">
                                    ⭐⭐⭐⭐ Good
                                </option>

                                <option value="3">
                                    ⭐⭐⭐ Average
                                </option>

                                <option value="2">
                                    ⭐⭐ Poor
                                </option>

                                <option value="1">
                                    ⭐ Very Poor
                                </option>

                            </select>

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Your Feedback
                            </label>

                            <textarea name="feedback"
                                      class="form-control"
                                      rows="5"
                                      placeholder="Write your feedback here..."
                                      required></textarea>

                        </div>

                        <button type="submit"
                                class="btn btn-mc-primary w-100">
                            ⭐ Submit Feedback
                        </button>

                    </form>


                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
