{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>MessCare - Admin Login</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet"
          href="{% static 'users/style.css' %}">

    <style>

        :root {
            --mc-green: #1b7a4c;
            --mc-green-dark: #145c39;
        }

        * {
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #111827;
        }

        .admin-login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .admin-login-card {
            width: 100%;
            max-width: 430px;

            background: #ffffff;
            border: none;
            border-radius: 18px;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        /* Admin Icon */

        .admin-icon {
            width: 64px;
            height: 64px;

            margin: auto;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--mc-green);
            color: #ffffff;

            border-radius: 16px;

            font-size: 29px;
        }

        /* Heading */

        .admin-title {
            color: #111827;
            font-weight: 700;
        }

        .admin-subtitle {
            color: #6b7280;
            font-size: 14px;
        }

        /* Labels */

        .form-label {
            color: #374151;
            font-size: 14px;
        }

        /* Inputs */

        .admin-input {
            border: 1px solid #dcdfe6;
            border-radius: 9px;
            padding: 11px 13px;
        }

        .admin-input:focus {
            border-color: var(--mc-green);
            box-shadow: 0 0 0 3px rgba(27, 122, 76, 0.12);
        }

        /* Login Button */

        .admin-login-btn {
            background: var(--mc-green);
            border: none;
            color: white;

            border-radius: 9px;
            padding: 11px;

            font-weight: 600;
        }

        .admin-login-btn:hover {
            background: var(--mc-green-dark);
            color: white;
        }

        /* Back Link */

        .back-login-link {
            color: var(--mc-green);
            font-size: 14px;
            font-weight: 600;
        }

        .back-login-link:hover {
            color: var(--mc-green-dark);
        }

        /* Admin Notice */

        .admin-notice {
            background: #f4f9f6;
            border-radius: 10px;
            padding: 10px 12px;

            color: #6b7280;
            font-size: 12px;
        }

        @media (max-width: 576px) {

            .admin-login-page {
                padding: 15px;
            }

            .admin-login-card {
                border-radius: 16px;
            }

        }

    </style>

</head>


<body>


<div class="admin-login-page">

    <div class="admin-login-card">

        <div class="p-4 p-md-5">


            <!-- HEADER -->

            <div class="text-center mb-4">

                <div class="admin-icon">
                    🔐
                </div>

                <h2 class="admin-title mt-3 mb-1">
                    Admin Portal
                </h2>

                <p class="admin-subtitle mb-0">
                    MessCare Administration
                </p>

            </div>


            <!-- ERROR -->

            {% if error %}

                <div class="alert alert-danger"
                     role="alert">

                    {{ error }}

                </div>

            {% endif %}


            <!-- LOGIN FORM -->

            <form method="POST">

                {% csrf_token %}


                <!-- USERNAME -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Admin Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        class="form-control admin-input"
                        placeholder="Enter admin username"
                        required>

                </div>


                <!-- PASSWORD -->

                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        Admin Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control admin-input"
                        placeholder="Enter admin password"
                        required>

                </div>


                <!-- LOGIN -->

                <button
                    type="submit"
                    class="btn admin-login-btn w-100">

                    🔐 Admin Login

                </button>

            </form>


            <!-- SMALL INFO -->

            <div class="admin-notice text-center mt-4">

                🔒 Authorized administration access only

            </div>


            <!-- BACK -->

            <div class="text-center mt-4">

                <a href="{% url 'login' %}"
                   class="text-decoration-none back-login-link">

                    ← Back to Student Login

                </a>

            </div>


        </div>

    </div>

</div>


</body>
</html>
