{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Edit User - MessCare</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet"
          href="{% static 'users/style.css' %}">

    <style>

        :root {
            --mc-green: #1b7a4c;
            --mc-green-dark: #145c39;
        }

        * {
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #f4f7f5;
        }

        /* ---------- NAVBAR ---------- */

        .messcare-navbar {
            background: linear-gradient(90deg, var(--mc-green) 0%, var(--mc-green-dark) 100%);
            padding: 13px 24px;
        }

        .messcare-navbar .navbar-brand {
            color: white;
            font-weight: 700;
            letter-spacing: 0.4px;
        }

        .back-users-btn {
            border-radius: 8px;
            font-size: 13px;
            padding: 6px 14px;
        }


        /* ---------- PAGE ---------- */

        .edit-page {
            padding: 40px 15px;
        }


        /* ---------- MAIN CARD ---------- */

        .edit-card {
            background: white;
            border: 1px solid #e7e7ee;
            border-radius: 18px;
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.06);
        }


        /* ---------- HEADER ---------- */

        .edit-icon {
            width: 62px;
            height: 62px;

            margin: auto;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #e8f7ee;
            border-radius: 16px;

            font-size: 29px;
        }

        .edit-title {
            color: #111827;
            font-weight: 700;
        }

        .edit-subtitle {
            color: #6b7280;
            font-size: 14px;
        }


        /* ---------- FORM ---------- */

        .form-label {
            color: #374151;
            font-size: 14px;
        }

        .form-control {
            border: 1px solid #dcdfe6;
            border-radius: 9px;
            padding: 11px 13px;
        }

        .form-control:focus {
            border-color: var(--mc-green);
            box-shadow: 0 0 0 3px rgba(27, 122, 76, 0.10);
        }


        /* ---------- FORM SECTIONS ---------- */

        .form-section {
            background: #fafafd;
            border: 1px solid #ededf2;
            border-radius: 13px;
            padding: 18px;
        }


        /* ---------- BUTTONS ---------- */

        .save-btn {
            background: var(--mc-green);
            border: none;
            color: white;

            border-radius: 9px;
            padding: 11px;

            font-weight: 600;
        }

        .save-btn:hover {
            background: var(--mc-green-dark);
            color: white;
        }

        .cancel-btn {
            background: white;
            border: 1px solid #d1d5db;
            color: #374151;

            border-radius: 9px;
            padding: 11px;

            font-weight: 600;
        }

        .cancel-btn:hover {
            background: #f9fafb;
            color: #111827;
        }


        @media (max-width: 576px) {

            .messcare-navbar {
                padding: 12px 15px;
            }

            .edit-page {
                padding: 25px 10px;
            }

            .edit-card {
                border-radius: 15px;
            }

            .form-section {
                padding: 15px;
            }

        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark messcare-navbar">

    <div class="container-fluid">

        <a class="navbar-brand"
           href="{% url 'adminpage' %}">

            🍽️ MessCare

        </a>

        <a href="{% url 'viewusers' %}"
           class="btn btn-outline-light btn-sm back-users-btn">

            ← Back to Users

        </a>

    </div>

</nav>


<!-- ================= PAGE ================= -->

<div class="container edit-page">

    <div class="row justify-content-center">

        <div class="col-md-9 col-lg-8">


            <!-- MAIN CARD -->

            <div class="edit-card">

                <div class="p-4 p-md-5">


                    <!-- HEADER -->

                    <div class="text-center mb-4">

                        <div class="edit-icon">
                            ✏️
                        </div>

                        <h2 class="edit-title mt-3 mb-1">
                            Edit User
                        </h2>

                        <p class="edit-subtitle mb-0">
                            Update student account information
                        </p>

                    </div>


                    <!-- FORM -->

                    <form method="POST">

                        {% csrf_token %}


                        <div class="form-section">


                            <!-- NAME -->

                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    👤 Name
                                </label>

                                <input
                                    type="text"
                                    name="name"
                                    class="form-control"
                                    value="{{ user.name }}"
                                    required>

                            </div>


                            <!-- EMAIL -->

                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    📧 Email
                                </label>

                                <input
                                    type="email"
                                    name="email"
                                    class="form-control"
                                    value="{{ user.email }}"
                                    required>

                            </div>


                            <!-- PHONE -->

                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    📱 Phone
                                </label>

                                <input
                                    type="text"
                                    name="phone_no"
                                    class="form-control"
                                    value="{{ user.phone_no }}"
                                    required>

                            </div>


                            <!-- HOSTEL -->

                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    🏠 Hostel Name
                                </label>

                                <input
                                    type="text"
                                    name="hostel_name"
                                    class="form-control"
                                    value="{{ user.hostel_name }}"
                                    required>

                            </div>


                            <!-- BRANCH -->

                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    🏢 Branch Name
                                </label>

                                <input
                                    type="text"
                                    name="branch_name"
                                    class="form-control"
                                    value="{{ user.branch_name }}"
                                    required>

                            </div>


                            <!-- ROOM -->

                            <div class="mb-1">

                                <label class="form-label fw-semibold">
                                    🚪 Room Number
                                </label>

                                <input
                                    type="text"
                                    name="room_no"
                                    class="form-control"
                                    value="{{ user.room_no }}"
                                    required>

                            </div>


                        </div>


                        <!-- BUTTONS -->

                        <div class="row g-2 mt-4">

                            <div class="col-md-6">

                                <button
                                    type="submit"
                                    class="btn save-btn w-100">

                                    💾 Save Changes

                                </button>

                            </div>

                            <div class="col-md-6">

                                
                                    href="{% url 'viewusers' %}"
                                    class="btn cancel-btn w-100">

                                    Cancel

                                </a>

                            </div>

                        </div>


                    </form>


                </div>

            </div>

        </div>

    </div>

</div>


</body>
</html>
